<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haider Ali</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#020617;color:#fff;overflow-x:hidden}

/* NAV */
nav{
  position:fixed;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

nav a{
  color:#38bdf8;
  margin-left:15px;
  cursor:pointer;
}

/* PAGES */
.page{
  display:none;
  min-height:100vh;
  padding:100px 20px;
  text-align:center;
}

.active{display:block}

/* HERO */
h1{font-size:40px}
.highlight{color:#38bdf8}

/* CARDS */
.cards{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  margin-top:20px;
}

.card{
  background:#0f172a;
  padding:20px;
  border-radius:15px;
  width:250px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 20px #38bdf8;
}

/* BUTTON */
.btn{
  margin-top:10px;
  display:inline-block;
  padding:10px 15px;
  background:#38bdf8;
  color:#000;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<nav>
  <h3>Haider</h3>
  <div>
    <a onclick="showPage('home')">Home</a>
    <a onclick="showPage('about')">About</a>
    <a onclick="showPage('projects')">Projects</a>
    <a onclick="showPage('contact')">Contact</a>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="page active">
  <h1>Hi 👋 I'm <span class="highlight">Haider Ali</span></h1>
  <p>React Native Developer | Full Stack</p>
</div>

<!-- ABOUT -->
<div id="about" class="page">
  <h1>About Me</h1>
  <p>I build mobile apps using React Native and backend systems with Node.js.</p>
</div>

<!-- PROJECTS -->
<div id="projects" class="page">
  <h1>Projects</h1>
  <div class="cards">
    <div class="card">
      <h3>Fish Farming Guide</h3>
      <p>React Native + Node.js</p>
      <a class="btn" href="https://github.com/Ali-Haider7/FishFarmingGuide">View</a>
    </div>
  </div>
</div>

<!-- CONTACT -->
<div id="contact" class="page">
  <h1>Contact</h1>
  <p>Email: ali9292haider@gmail.com</p>
  <p>
    <a href="https://linkedin.com/in/haider-ali-4367752b6" style="color:#38bdf8;">LinkedIn</a>
  </p>
</div>

<script>
function showPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
}
</script>

</body>
</html>
